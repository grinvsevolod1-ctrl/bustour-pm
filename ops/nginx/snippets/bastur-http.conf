# =============================================================================
# БасТур — директивы уровня http {}.
# Устанавливается ops/nginx/apply.sh в /etc/nginx/conf.d/bastur-http.conf
# на каждом деплое. Править ТОЛЬКО здесь (в git), не на сервере.
# Блок brotli apply.sh дописывает в конец, если модуль nginx доступен.
# =============================================================================

# Ограничение частоты запросов к API на уровне nginx (первая линия обороны)
limit_req_zone $binary_remote_addr zone=bastur_api:10m rate=10r/s;

# Микрокеш HTML для анонимных посетителей (см. snippets/bastur-proxy.conf).
# Директория создаётся apply.sh — без неё nginx -t падает.
proxy_cache_path /var/cache/nginx/bastur levels=1:2 keys_zone=bastur_html:10m
                 max_size=256m inactive=10m use_temp_path=off;

# Сжатие текстовых ответов. "gzip on;" не дублируем — он уже включён
# в /etc/nginx/nginx.conf (Ubuntu default).
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml application/rss+xml image/svg+xml font/woff2;

# HSTS только на https: для http значение пустое, а пустой add_header nginx
# не отправляет. includeSubDomains не ставим — не все поддомены на HTTPS.
map $scheme $bastur_hsts {
    https   "max-age=63072000";
    default "";
}
