# =============================================================================
# БасТур — содержимое server {} (общее для :80 и :443 ssl).
# Устанавливается ops/nginx/apply.sh в /etc/nginx/snippets/bastur-proxy.conf
# и подключается в сгенерированный sites-available/bastur.conf через include.
# Править ТОЛЬКО здесь (в git), не на сервере.
# =============================================================================

# Максимальный размер загрузки (фото/видео в админке)
client_max_body_size 512m;

# Реальный IP клиента для rate-limit'ов приложения
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host $host;
proxy_http_version 1.1;

# Срезаем внутренний маркер avia-rewrite из ВНЕШНИХ запросов: он должен
# приходить только от самопроксированного rewrite'а (loopback, мимо nginx).
# В приложении значение дополнительно подписано HMAC — это вторая линия.
proxy_set_header X-Bastur-Avia-Rewrite "";

# Долгие загрузки медиа в админке
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# HSTS (пустой на http). ВАЖНО: add_header не наследуется в location,
# где есть свой add_header, — поэтому продублирован в /_next/static/ и /.
add_header Strict-Transport-Security $bastur_hsts always;

# Статика Next.js — агрессивный кэш (immutable-хэши в именах)
location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    # Next шлёт такой же Cache-Control — скрываем, чтобы не было двух заголовков
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security $bastur_hsts always;
}

# Оптимизированные картинки: Next сам кеширует их на диске на 31 день и
# ставит корректный Cache-Control. В HTML-микрокеш (10 с) им попадать незачем.
location /_next/image {
    proxy_pass http://127.0.0.1:3000;
    add_header Strict-Transport-Security $bastur_hsts always;
}

# Файлы из public/ (логотип, иконки соцсетей, OG-картинка): Next отдаёт их с
# max-age=0, и браузер перезапрашивал их на каждой странице. Имена без хэшей,
# поэтому сутки, а не год; stale-while-revalidate сглаживает момент протухания.
location ~* ^/(figma|images)/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    add_header Strict-Transport-Security $bastur_hsts always;
}

# Загруженные файлы — Range-стриминг проксируется как есть
location /uploads/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_buffering off;
}

location /api/ {
    limit_req zone=bastur_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:3000;
}

# Админка — никогда не кешируется
location /admin {
    proxy_pass http://127.0.0.1:3000;
}

location / {
    proxy_pass http://127.0.0.1:3000;

    # --- Микрокеш анонимного HTML (10 секунд) ---
    # Все публичные страницы рендерятся динамически, микрокеш снимает
    # нагрузку при всплесках и отдаёт повторные запросы за миллисекунды.
    # Проверка: curl -sI https://bus-tour.by/ | grep X-Cache-Status
    # — второй запрос подряд должен дать HIT.
    proxy_cache bastur_html;
    proxy_cache_valid 200 10s;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_methods GET HEAD;
    # Обход кеша: залогиненный админ и любые не-GET запросы
    proxy_cache_bypass $cookie_bastur_admin;
    proxy_no_cache $cookie_bastur_admin;
    # ВАЖНО: Next.js отдаёт динамические страницы с
    # "Cache-Control: private, no-cache, no-store". По умолчанию nginx
    # уважает этот заголовок и НЕ кладёт ответ в кеш — микрокеш молча
    # не работал (X-Cache-Status всегда MISS). Игнорируем Cache-Control/
    # Expires только для решения о кешировании на nginx; браузеру заголовок
    # уходит как есть, он HTML по-прежнему не кеширует.
    # Set-Cookie: не отдавать одному пользователю куку другого.
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    # Next шлёт Vary: RSC, Next-Router-State-Tree, ... — nginx учитывает
    # его в ключе, поэтому HTML и RSC-payload клиентской навигации
    # кешируются раздельно и не перемешиваются.
    # При падении бэкенда отдаём последнюю удачную копию.
    # updating + background_update: когда 10 с истекли, посетитель СРАЗУ
    # получает предыдущую копию (X-Cache-Status: STALE), а nginx обновляет её
    # в фоне. Без этого первый запрос после протухания (в т.ч. PageSpeed)
    # ждал полный рендер страницы — TTFB 0,4–0,8 с вместо ~20 мс.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status;
    add_header Strict-Transport-Security $bastur_hsts always;
}
